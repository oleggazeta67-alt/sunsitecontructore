<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Орбита — восемь миров вокруг Солнца</title>
<meta name="description" content="Интерактивная модель Солнечной системы с фактами о каждой планете.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Onest:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#04050d;--panel:#0b0e1d;--line:#1b2142;--text:#eef1ff;--dim:#8f98c4;--sun:#ffb454;--c:#7aa2ff;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(1200px 700px at 50% 0,#10163a 0,var(--bg) 70%) fixed,var(--bg);color:var(--text);font:400 17px/1.65 Onest,system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);min-height:100vh}
.wrap{max-width:1000px;margin:0 auto;padding:0 22px}
header{padding:44px 0 0}
h1{font:800 clamp(34px,7.4vw,76px)/1.02 Unbounded,sans-serif;margin:0 0 16px;letter-spacing:-.03em;max-width:13ch}
.sub{color:var(--dim);font-size:19px;max-width:48ch;margin:0}
.stage{position:relative;margin:10px 0 0}
canvas{display:block;width:100%;height:clamp(300px,60vw,540px);cursor:pointer;touch-action:manipulation}
.hint{color:var(--dim);font-size:14px;margin:0 0 22px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.tabs button{flex:none;display:flex;align-items:center;gap:9px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:9px 16px;font:500 15px Onest,sans-serif;cursor:pointer;transition:border-color .2s,background .2s}
.tabs button i{width:11px;height:11px;border-radius:50%;background:var(--c)}
.tabs button:hover{border-color:var(--c)}
.tabs button:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.tabs button[aria-pressed=true]{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,var(--panel))}
.card{display:grid;grid-template-columns:1.1fr 1fr;gap:34px;margin-top:14px;padding:34px;border:1px solid var(--line);border-radius:22px;background:var(--panel);position:relative;overflow:hidden}
.card::before{content:"";position:absolute;right:-90px;top:-90px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,var(--pc,#7aa2ff) 0,transparent 68%);opacity:.28;pointer-events:none;transition:background .4s}
.card h2{font:800 clamp(30px,5vw,48px)/1.05 Unbounded,sans-serif;margin:0 0 6px;letter-spacing:-.02em}
.card .kind{color:var(--dim);margin:0 0 20px}
.card p.t{margin:0;max-width:44ch}
.stats{display:grid;gap:14px;align-content:start;position:relative}
.stat{border-top:1px solid var(--line);padding-top:12px}
.stat b{display:block;font:600 clamp(24px,3.6vw,34px)/1.1 Unbounded,sans-serif;color:var(--pc,#fff)}
.stat span{color:var(--dim);font-size:15px}
footer{padding:46px 0 60px;color:var(--dim);font-size:14px}
@media(max-width:720px){.card{grid-template-columns:1fr;padding:24px;gap:22px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Восемь миров, одна звезда</h1>
  <p class="sub">Модель Солнечной системы. Планеты ходят по орбитам: выбери одну или кликни по ней.</p>
</header>

<div class="stage"><canvas id="cv" role="img" aria-label="Анимация орбит планет Солнечной системы"></canvas></div>
<p class="hint">Расстояния и скорости условные: так всё помещается на экран.</p>

<div class="tabs" id="tabs"></div>

<article class="card" id="card" aria-live="polite">
  <div>
    <h2 id="name"></h2>
    <p class="kind" id="kind"></p>
    <p class="t" id="text"></p>
  </div>
  <div class="stats" id="stats"></div>
</article>

<footer>Данные: NASA. Сайт одним файлом, без библиотек.</footer>
</div>

<script>
(function(){
var P=[
{n:'Меркурий',k:'Каменная · ближайшая к Солнцу',c:'#b9b4ad',s:3.2,d:88,t:'Самая маленькая планета и самая быстрая: вокруг Солнца она обходит за неполные три земных месяца. Атмосферы почти нет, поэтому ночью здесь очень холодно.',st:[['88 суток','длится год'],['4 879 км','диаметр'],['≈ 430 °C','днём на поверхности']]},
{n:'Венера',k:'Каменная · самая горячая',c:'#e8c27a',s:5.6,d:225,t:'Плотная атмосфера из углекислого газа создаёт парниковый эффект, и на Венере жарче, чем на Меркурии. Она вращается в обратную сторону, а её сутки длиннее года.',st:[['≈ 465 °C','на поверхности'],['243 суток','оборот вокруг оси'],['225 суток','длится год']]},
{n:'Земля',k:'Каменная · наш дом',c:'#5aa4ff',s:5.8,d:365,t:'Единственное место, где точно известна жизнь. Три четверти поверхности покрывает вода, а Луна стабилизирует наклон оси.',st:[['365 суток','длится год'],['149,6 млн км','до Солнца'],['12 742 км','диаметр']]},
{n:'Марс',k:'Каменная · красная планета',c:'#e0693f',s:4.4,d:687,t:'Красный цвет даёт оксид железа в грунте. На Марсе стоит самый высокий вулкан Солнечной системы, гора Олимп.',st:[['≈ 22 км','высота горы Олимп'],['687 суток','длится год'],['2 спутника','Фобос и Деймос']]},
{n:'Юпитер',k:'Газовый гигант',c:'#d9a37a',s:11,d:4333,t:'Самая большая планета: её масса в два с половиной раза больше массы всех остальных планет вместе. Большое красное пятно — шторм, который наблюдают столетиями.',st:[['≈ 11 Земель','в поперечнике'],['≈ 12 лет','длится год'],['≈ 10 часов','длятся сутки']]},
{n:'Сатурн',k:'Газовый гигант · с кольцами',c:'#ead9a6',s:9.6,d:10759,ring:1,t:'Средняя плотность Сатурна меньше плотности воды. Его кольца состоят из льда и камней и тянутся на сотни тысяч километров, но очень тонкие.',st:[['≈ 29,5 лет','длится год'],['≈ 0,7 г/см³','плотность'],['≈ 10,7 часа','длятся сутки']]},
{n:'Уран',k:'Ледяной гигант',c:'#8fe3e3',s:7.4,d:30687,t:'Ось Урана наклонена почти на 98°, поэтому планета как будто катится по орбите на боку. Полюса по очереди смотрят на Солнце десятки лет.',st:[['≈ 98°','наклон оси'],['84 года','длится год'],['≈ −224 °C','самая низкая температура']]},
{n:'Нептун',k:'Ледяной гигант · самая далёкая',c:'#4f6dff',s:7.2,d:60190,t:'Здесь самые сильные ветры в Солнечной системе: они разгоняются примерно до двух тысяч километров в час. Нептун нашли сначала расчётами, а уже потом увидели в телескоп.',st:[['≈ 165 лет','длится год'],['до 2 000 км/ч','скорость ветра'],['4,5 млрд км','до Солнца']]}
];
var sel=2,tabs=document.getElementById('tabs');
var cv=document.getElementById('cv'),cx=cv.getContext('2d');
var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var W=0,H=0,dpr=1,t0=performance.now(),pos=[];
var stars=[];for(var i=0;i<140;i++)stars.push([Math.random(),Math.random(),Math.random()*1.3+.2,Math.random()]);

P.forEach(function(p,i){
  var b=document.createElement('button');b.type='button';b.style.setProperty('--c',p.c);
  b.innerHTML='<i></i>'+p.n;b.addEventListener('click',function(){pick(i)});tabs.appendChild(b);p.b=b;
});
function pick(i){
  sel=i;var p=P[i];
  P.forEach(function(q,j){q.b.setAttribute('aria-pressed',j===i)});
  document.getElementById('name').textContent=p.n;
  document.getElementById('kind').textContent=p.k;
  document.getElementById('text').textContent=p.t;
  document.getElementById('stats').innerHTML=p.st.map(function(s){return '<div class="stat"><b>'+s[0]+'</b><span>'+s[1]+'</span></div>'}).join('');
  document.getElementById('card').style.setProperty('--pc',p.c);
  p.b.scrollIntoView({block:'nearest',inline:'center',behavior:reduce?'auto':'smooth'});
  if(reduce)draw(0);
}
function size(){
  dpr=window.devicePixelRatio||1;var r=cv.getBoundingClientRect();W=r.width;H=r.height;
  cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
}
function draw(now){
  var t=reduce?2:(now-t0)/1000;
  cx.clearRect(0,0,W,H);
  stars.forEach(function(s){cx.globalAlpha=.25+.55*Math.abs(Math.sin(t*.4+s[3]*9));cx.fillStyle='#fff';cx.fillRect(s[0]*W,s[1]*H,s[2],s[2])});
  cx.globalAlpha=1;
  var mx=W/2,my=H/2,R=Math.min(W/2-14,(H/2-14)/.42);
  var g=cx.createRadialGradient(mx,my,0,mx,my,R*.2);
  g.addColorStop(0,'#fff3c4');g.addColorStop(.25,'#ffb454');g.addColorStop(1,'rgba(255,140,40,0)');
  cx.fillStyle=g;cx.beginPath();cx.arc(mx,my,R*.2,0,7);cx.fill();
  cx.fillStyle='#ffd27a';cx.beginPath();cx.arc(mx,my,Math.max(9,R*.045),0,7);cx.fill();
  P.forEach(function(p,i){
    var r=R*(.17+i*.118),ry=r*.42;
    cx.strokeStyle=i===sel?p.c:'rgba(143,152,196,.22)';cx.lineWidth=i===sel?1.4:1;
    cx.globalAlpha=i===sel?.7:1;
    cx.beginPath();cx.ellipse(mx,my,r,ry,0,0,7);cx.stroke();cx.globalAlpha=1;
    var a=i*1.7+t*.9/Math.pow(p.d/88,.6);
    var x=mx+Math.cos(a)*r,y=my+Math.sin(a)*ry;
    var sz=p.s*(W<520?.62:.8)*(1+Math.sin(a)*.08);
    pos[i]=[x,y,Math.max(sz,6)];
    if(i===sel){var h=cx.createRadialGradient(x,y,0,x,y,sz*3.4);h.addColorStop(0,p.c+'88');h.addColorStop(1,p.c+'00');cx.fillStyle=h;cx.beginPath();cx.arc(x,y,sz*3.4,0,7);cx.fill();}
    if(p.ring){cx.strokeStyle='rgba(234,217,166,.75)';cx.lineWidth=1.6;cx.beginPath();cx.ellipse(x,y,sz*1.9,sz*.55,-.35,0,7);cx.stroke();}
    cx.fillStyle=p.c;cx.beginPath();cx.arc(x,y,sz,0,7);cx.fill();
    if(i===sel){cx.fillStyle='#eef1ff';cx.font='500 13px Onest,sans-serif';cx.textAlign='center';cx.fillText(p.n,x,y-sz-10);}
  });
  if(!reduce)requestAnimationFrame(draw);
}
cv.addEventListener('click',function(e){
  var r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,best=-1,bd=1e9;
  pos.forEach(function(q,i){var d=Math.hypot(q[0]-x,q[1]-y);if(d<bd&&d<q[2]+16){bd=d;best=i}});
  if(best>-1)pick(best);
});
window.addEventListener('resize',function(){size();if(reduce)draw(0)});
size();pick(sel);requestAnimationFrame(draw);
})();
</script>
</body>
</html>
